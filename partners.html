<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合作与导师 | UESTC IA</title>
  <link rel="icon" href="assets/images/logo.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="assets/images/logo.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="assets/images/logo.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/render-partners.js" defer></script>
</head>
<body class="pt-24">
  <main class="ia-page pb-12">
    <header class="ia-page-header">
      <div class="ia-kicker">Partners & Advisors</div>
      <h1 class="ia-page-title">合作与导师</h1>
    </header>

    <section class="ia-section">
      <h2 class="ia-section-title">学术指导委员会</h2>
      <div id="advisorsGrid" class="grid gap-5 md:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    </section>

    <section class="ia-section">
      <h2 class="ia-section-title">战略支撑单位</h2>
      <div id="organizationsGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    </section>

    <section class="ia-section">
      <h2 class="ia-section-title">辐射高校</h2>
      <div class="ia-university-board">
        <div id="universitiesGrid" class="ia-university-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="ia-section">
      <h2 class="ia-section-title">合作伙伴</h2>
      <div id="partnersGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    </section>

    <section class="ia-section">
      <h2 class="ia-section-title">合作信息</h2>
      <div id="cooperationInfoGrid" class="grid gap-5" aria-live="polite"></div>
    </section>

    <section class="ia-section" aria-labelledby="cooperation-contact-title">
      <div class="ia-card flex flex-col gap-5 p-6 sm:flex-row sm:items-center sm:justify-between sm:p-8">
        <div>
          <h2 id="cooperation-contact-title" class="ia-text-ink text-xl font-bold">交流与合作</h2>
          <p class="ia-text-muted mt-2 text-sm leading-7">欢迎高校、科研团队与企业联系我们，交流跨学科研究与项目合作。</p>
        </div>
        <a class="ia-btn ia-btn-primary shrink-0 gap-2 self-start sm:self-auto" href="email.html">
          洽谈合作
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
